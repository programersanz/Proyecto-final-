{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'dashboard_aprendiz.css' %}" />

{% block content %}
<div class="dashboard-container">
  <h2>Dashboard Aprendiz</h2>
  <div class="hours-summary">
    <h3>Total de Horas: {{ total_horas }}</h3>
  </div>
  <div class="hours-list">
    <table>
      <thead>
        <tr>
          <th>Actividad</th>
          <th>Fecha</th>
          <th>Horas</th>
        </tr>
      </thead>
      <tbody>
        {% for registro in horas_ludicas %}
        <tr>
          <td>{{ registro.descripcion }}</td>
          <td>{{ registro.fecha|date:"d-m-Y" }}</td>
          <td>{{ registro.horas }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% block content %}
<!-- Estilos y tipografía -->
<link rel="preconnect" href="https://fonts.gstatic.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'eliminar_horas_parcial.css' %}">

<div class="confirm-container">
  <h2>Confirmar Eliminación de Horas</h2>

  <div class="registro-info">
    <p><strong>Descripción:</strong> {{ registro.descripcion }}</p>
    <p><strong>Horas actuales:</strong> {{ registro.horas }}</p>
  </div>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="btn-group">
      <button type="submit" class="btn-delete">Eliminar</button>
      <a href="{% url 'detalle_aprendiz' registro.usuario.id %}" class="btn-cancel">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

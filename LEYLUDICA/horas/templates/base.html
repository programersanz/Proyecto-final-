{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley Lúdica</title>
    {% load static %}
    <link rel="stylesheet" href="{% static '/base.css' %}">
</head>
<body>

<!-- Barra de navegación -->
<!-- Barra de navegación -->
<nav class="navbar">
    <div class="navbar-container">
      <!-- Sección izquierda: Logo SENA + Texto "Ley Lúdica" -->
      <div class="left-section">
        <a href="{% url 'home' %}">
          <img src="{% static 'img/logo_sena.png' %}" alt="Logo SENA" class="logo-img">
        </a>
        <a href="{% url 'home' %}" class="logo-text">Ley Lúdica</a>
      </div>
      
      <!-- Sección derecha: Menú de navegación -->
      <ul class="nav-links">
        <li><a href="{% url 'home' %}">Inicio</a></li>
        {% if user.is_authenticated %}
          <li>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
              {% csrf_token %}
              <button type="submit" class="logout-btn">Cerrar sesión</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Iniciar sesión</a></li>
          <li><a href="{% url 'register' %}">Registrarse</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  


<!-- Contenido dinámico -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

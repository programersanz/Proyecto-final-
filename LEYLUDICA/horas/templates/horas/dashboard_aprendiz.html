{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'dashboard_aprendiz.css' %}" />

{% block content %}
<div class="dashboard-container">
  <h2>Dashboard Aprendiz</h2>
  <div class="hours-summary">
    <h3>Total de Horas: {{ total_horas }}</h3>
  </div>
  <div class="hours-list">
    <table>
      <thead>
        <tr>
          <th>Descripción</th>
          <th>Fecha</th>
          <th>Horas</th>
        </tr>
      </thead>
      <tbody>
        {% for h in horas_ludicas %}
        <tr>
          <td>{{ h.descripcion }}</td>
          <td>{{ h.fecha }}</td>
          <td>{{ h.horas }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'horas/eliminar_horas.css' %}">

{% block content %}
<div class="confirm-container">
  <h2>Eliminar Registro de Horas</h2>
  <p>¿Estás seguro de que deseas eliminar este registro?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-delete">Eliminar</button>
    <a href="{% url 'dashboard_aprendiz' %}" class="btn-cancel">Cancelar</a>
  </form>
</div>
{% endblock %}

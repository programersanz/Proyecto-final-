{% extends "base.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'horas/editar_perfil.css' %}">

{% block content %}
<div class="perfil-container">
    <h2>Editar Perfil</h2>
    <form method="post">
        {% csrf_token %}
        <fieldset>
            <legend>Datos de Usuario</legend>
            {{ user_form.as_p }}
        </fieldset>
        <fieldset>
            <legend>Datos de Perfil</legend>
            {{ profile_form.as_p }}
        </fieldset>
        <button type="submit">Guardar cambios</button>
    </form>
</div>
{% endblock %}

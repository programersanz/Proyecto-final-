<!-- templates/home.html -->
{% extends "base.html" %}

{% block content %}
  {% if user.is_authenticated %}
    <h1>Bienvenido {{ user.username }}</h1>
    <p>Esta es la página de inicio de LEYLUDICA.</p>
  {% else %}
    <h1>Bienvenido, Invitado</h1>
    <p>
      <a href="{% url 'login' %}">Iniciar sesión</a> o 
      <a href="{% url 'register' %}">Registrarse</a>
    </p>
  {% endif %}
{% endblock %}
